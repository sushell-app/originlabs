name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi
          NOTES="$(cat <<EOF
          ### Instalación / Actualización en 1 comando

          \`\`\`bash
          curl -fsSL https://sushell.com/labs | sudo bash
          \`\`\`

          - Imagen multi-arquitectura: \`ghcr.io/sushell-app/originlabs:${TAG#v}\` (\`linux/amd64\`, \`linux/arm64\`)
          - Incluye orquestación de workspaces vía \`docker-socket-proxy\` interno sin \`root\`.
          EOF
          )"
          args=(
            --title "OriginLabs ${TAG}"
            --notes "${NOTES}"
            --generate-notes
          )
          if [[ "${TAG}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}"
