name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        shell: bash
        run: |
          set +e
          output=$(mypy --show-error-codes app 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "$output" | tr '\\' '/' | sed -nE 's|^([^:]+):([0-9]+): error: (.*)$|::error file=backend/\1,line=\2::\3|p'
          fi
          exit "$status"
      - name: Run unit tests (pytest)
        run: pytest -v

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  integration-e2e:
    name: Live E2E (Postgres 16 + Redis 7 + Alembic)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: originlabs
          POSTGRES_USER: originlabs
          POSTGRES_PASSWORD: originlabs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U originlabs -d originlabs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ORIGINLABS_ENV: development
      ORIGINLABS_DOMAIN: localhost
      DATABASE_URL: postgresql+asyncpg://originlabs:originlabs@127.0.0.1:5432/originlabs
      REDIS_URL: redis://127.0.0.1:6379/0
      ORIGINLABS_ENCRYPTION_KEY: ci-test-encryption-key-32-bytes-ok
      ORIGINLABS_RUN_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Alembic migrations up/down/up
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run live E2E API test suite
        run: pytest tests/test_e2e_live.py -v

  infra-and-distros:
    name: Infra & Linux Distros (Ubuntu 22/24 + Debian 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configs
        run: |
          docker compose --env-file .env.example -f compose.dev.yml config -q
          docker compose --env-file .env.example -f compose.prod.yml config -q
      - name: Validate Bash installer scripts
        run: |
          bash -n installer/install.sh
          bash -n installer/uninstall.sh
          set +e
          sc_out=$(shellcheck -f gcc installer/install.sh installer/uninstall.sh 2>&1)
          sc_rc=$?
          echo "$sc_out"
          if [ "$sc_rc" -ne 0 ]; then
            echo "$sc_out" | sed -nE 's|^([^:]+):([0-9]+):[0-9]+: (.*)$|::error file=\1,line=\2::\3|p'
          fi
          exit "$sc_rc"
      - name: Test installer dry-run on Ubuntu 22.04, 24.04 & Debian 12
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "=== Testing installer on ${image} ==="
            docker run --rm -v "$PWD/installer:/installer:ro" -e ORIGINLABS_DRY_RUN=1 "${image}" bash /installer/install.sh
          done

  container-smoke:
    name: Single Container & 1-Command Installer E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unified OriginLabs container image
        run: docker build -t originlabs:ci .
      - name: Install OriginLabs with 1-command installer and verify HTTP
        run: |
          set +e
          (
            set -e
            sudo bash installer/install.sh \
              --domain localhost \
              --http-only \
              --skip-resource-check \
              --image originlabs:ci \
              --local-source "$PWD" \
              --install-dir /tmp/originlabs-ci-install
            curl -fsS http://127.0.0.1/ | grep -q "OriginLabs"
            curl -fsS http://127.0.0.1/api/v1/health | grep -q '"status":"ok"'
            curl -fsS http://127.0.0.1/api/v1/meta | grep -q '"setup_required":true'
          ) > /tmp/smoke.log 2>&1
          smoke_rc=$?
          cat /tmp/smoke.log
          if [ "$smoke_rc" -ne 0 ]; then
            docker compose --project-directory /tmp/originlabs-ci-install -f /tmp/originlabs-ci-install/compose.prod.yml ps -a || true
            docker compose --project-directory /tmp/originlabs-ci-install -f /tmp/originlabs-ci-install/compose.prod.yml logs --tail=40 || true
            last_err=$(grep -v '^[[:space:]]*$' /tmp/smoke.log | tail -n 1 || true)
            echo "::error::${last_err:-Smoke test failed}"
          fi
          exit "$smoke_rc"
      - name: Uninstall cleanly with uninstall.sh --purge
        if: always()
        run: |
          sudo env ORIGINLABS_INSTALL_DIR=/tmp/originlabs-ci-install bash installer/uninstall.sh --purge || true
          docker compose --project-directory /tmp/originlabs-ci-install -f /tmp/originlabs-ci-install/compose.prod.yml down -v --remove-orphans 2>/dev/null || true
