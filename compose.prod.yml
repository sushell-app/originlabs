services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-originlabs}
      POSTGRES_USER: ${POSTGRES_USER:-originlabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-originlabs} -d ${POSTGRES_DB:-originlabs}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - originlabs_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - originlabs_net

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PING: 1
      VERSION: 1
      INFO: 1
      EVENTS: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      POST: 1
    networks:
      - originlabs_net

  api:
    image: ${ORIGINLABS_IMAGE:-ghcr.io/sushell-app/originlabs:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ORIGINLABS_ENV: production
      ORIGINLABS_AUTO_MIGRATE: ${ORIGINLABS_AUTO_MIGRATE:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://docker-proxy:2375}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - originlabs_net

  worker:
    image: ${ORIGINLABS_IMAGE:-ghcr.io/sushell-app/originlabs:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ORIGINLABS_ENV: production
      ORIGINLABS_AUTO_MIGRATE: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://docker-proxy:2375}
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    networks:
      - originlabs_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ORIGINLABS_DOMAIN: ${ORIGINLABS_DOMAIN:?ORIGINLABS_DOMAIN is required}
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - originlabs_net
      - originlabs_workspaces

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  originlabs_net:
    name: originlabs_net
    driver: bridge
  originlabs_workspaces:
    name: originlabs_workspaces
    driver: bridge
